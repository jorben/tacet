<!-- Tacet 交互原型（单文件）。依据 docs/v1/tacet-requirements.md v0.10。右下角“原型场景”可直达各页面；URL 可用 #scene=s2 / b2 等。 -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --bg:#E8E8E6;--win:#FAFAF8;--surface:#FFFFFF;--surface-2:#F1F4F0;--hover:rgba(47,78,53,.05);
 --ink:#172032;--ink-2:#465064;--muted:#747C8E;--faint:#A0A6AC;--line:#E1E5E1;--line-2:#EDF0EC;
 --primary:#34734F;--on-primary:#fff;--primary-soft:#EDF5EE;--ring:#4F8E68;
 --ok:#13834C;--ok-soft:#E6F5EC;--warn:#985A06;--warn-soft:#FAEFD8;--bad:#B42318;--bad-soft:#FBE7E4;
 --redact:#141619;--paper:#FFFFFF;--paper-ink:#23262A;
 --t-org:#8C6A1F;--t-name:#6550C8;--t-phone:#0B7A8F;--t-email:#2F6FB5;--t-id:#B4570B;--t-addr:#4E7A12;--t-card:#B0234F;--t-date:#8A4FC2;--t-other:#5B6470;--t-img:#5B6470;
 --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
 --pop:0 12px 32px rgba(0,0,0,.16),0 1px 3px rgba(0,0,0,.08);
 --ease:cubic-bezier(.2,.8,.2,1);
 --page-w:880px;--rail-w:60px;
 --botanical-soft:#F0F5EC;--drop-bg:rgba(247,251,247,.75);--drop-line:#C4D8C9;--icon-bg:#EDF6EF;--home-caption:#8A8D97;
 font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
}
[data-theme=dark]{
 --bg:#0A0B0D;--win:#16181B;--surface:#1D2024;--surface-2:#23272C;--hover:rgba(255,255,255,.06);
 --ink:#ECEDEF;--ink-2:#C6C9CE;--muted:#8F959D;--faint:#5E646C;--line:#2C3036;--line-2:#25292E;
 --primary:#9BC8A8;--on-primary:#13251A;--primary-soft:rgba(155,200,168,.12);--ring:#9BC8A8;
 --botanical-soft:#213026;--drop-bg:rgba(27,38,30,.72);--drop-line:#3B5844;--icon-bg:#263A2D;--home-caption:#929A94;
 --ok:#5CC48C;--ok-soft:rgba(92,196,140,.14);--warn:#E3AE55;--warn-soft:rgba(227,174,85,.14);--bad:#F2877B;--bad-soft:rgba(242,135,123,.14);
 --paper:#EEEDE9;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);--pop:0 12px 32px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.06);
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,select{font:inherit;color:inherit}
.i{flex:none;display:block}
:focus{outline:none}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .sm{font-size:12px} .sp{flex:1}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12px}

/* window */
.win{width:100%;max-width:1440px;height:100%;max-height:920px;background:var(--win);border-radius:12px;box-shadow:0 0 0 .5px rgba(0,0,0,.2),0 24px 70px rgba(0,0,0,.2);display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);grid-template-rows:44px minmax(0,1fr);overflow:hidden;position:relative}
.titlebar{grid-column:1/-1;display:flex;align-items:center;padding:0 12px 0 16px;border-bottom:1px solid var(--line);gap:12px;user-select:none;position:relative}
.lights{display:flex;gap:8px}
.lights button{width:12px;height:12px;border-radius:50%;background:#ff5f57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18)}
.lights button:nth-child(2){background:#febc2e}.lights button:nth-child(3){background:#28c840}
.tb-title{position:absolute;left:50%;transform:translateX(-50%);font-weight:600;font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:8px;max-width:50%;white-space:nowrap}
.tb-title span{overflow:hidden;text-overflow:ellipsis}
.btn.tb-back{margin-left:8px;height:32px;padding:0 8px;font-size:12px;flex:none}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:2px;color:var(--muted)}
@media (max-width:700px){
 .titlebar:has(#tbBack button) .tb-title{position:static;transform:none;min-width:0;max-width:none;flex:1}
 .titlebar:has(#tbBack button) .tb-right{margin-left:0}
}
.rail{border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px}
.rail button{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s}
.rail button:hover{background:var(--hover);color:var(--ink)}
.rail button[aria-current=page]{background:var(--icon-bg);color:var(--ink)}
.rail .dotb{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--win)}
.rail .sp{flex:1}
main{overflow:hidden;position:relative;display:flex;flex-direction:column;min-height:0;min-width:0}
#layer{position:absolute;inset:0;pointer-events:none;z-index:20}
#layer>*{pointer-events:auto}

/* tooltip */
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--win);font-size:12px;line-height:1.4;padding:5px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;z-index:60;font-weight:400;letter-spacing:0;text-indent:0;animation:tip .12s .4s both}
[data-tip][data-tr]:hover::after{left:auto;right:0;transform:none}
[data-tip][data-tt]:hover::after{top:auto;bottom:calc(100% + 6px)}
.rail [data-tip]:hover::after{top:50%;left:calc(100% + 8px);transform:translateY(-50%)}
@keyframes tip{from{opacity:0}to{opacity:1}}

/* buttons */
.btn{height:34px;padding:0 14px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500;white-space:nowrap;transition:background .15s,box-shadow .15s,filter .15s,opacity .15s}
.btn-p{background:var(--primary);color:var(--on-primary)}
.btn-p:hover{filter:brightness(1.12)}
.btn-s{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
.btn-s:hover{background:var(--surface-2)}
.btn-g{color:var(--ink-2)}.btn-g:hover{background:var(--hover)}
.btn-d{color:var(--bad)}.btn-d:hover{background:var(--bad-soft)}
.btn-lg{height:44px;padding:0 22px;font-size:15px;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.ib{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s;flex:none}
.ib:hover{background:var(--hover);color:var(--ink)}
.sel{height:30px;padding:0 6px 0 10px;border-radius:7px;display:inline-flex;align-items:center;gap:4px;color:var(--ink-2);white-space:nowrap;transition:background .15s}
.sel:hover{background:var(--hover);color:var(--ink)}
.sel.sm{height:26px;font-size:12px;padding:0 4px 0 8px}
.seg{display:inline-flex;background:var(--hover);border-radius:8px;padding:2px;gap:2px}
.seg button{height:28px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:5px;border-radius:6px;font-size:13px;color:var(--muted);transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 .5px var(--line)}
.seg.full{display:flex}.seg.full button{flex:1}
.tg{width:36px;height:22px;border-radius:11px;background:var(--line);position:relative;transition:background .2s;flex:none}
.tg::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s var(--ease)}
.tg[aria-checked=true]{background:var(--ok)}
.tg[aria-checked=true]::after{transform:translateX(14px)}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.pri{background:var(--primary-soft);color:var(--primary)}
.pill.ghost{background:none;box-shadow:inset 0 0 0 1px var(--line)}
button.pill:hover{filter:brightness(.97)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.sw{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}

/* page scaffolds */
.page{flex:1;overflow:auto;padding:32px 40px 56px}
.page-inner{width:100%;max-width:var(--page-w);margin:0 auto}
.center{flex:1;display:flex;align-items:center;justify-content:center;padding:40px}
.sec-t{font-size:12px;font-weight:600;color:var(--muted);margin:28px 4px 10px;display:flex;align-items:center;gap:8px}
.h1{font-size:22px;font-weight:650;letter-spacing:-.01em}
.list{background:var(--surface);border-radius:12px;box-shadow:inset 0 0 0 1px var(--line)}
.row{display:flex;align-items:center;gap:12px;min-height:54px;padding:8px 14px 8px 16px;border-top:1px solid var(--line-2);width:100%}
.row:first-child{border-top:0}
button.row{transition:background .15s}button.row:hover{background:var(--surface-2)}
.list>.row:first-child{border-radius:12px 12px 0 0}.list>.row:last-child{border-radius:0 0 12px 12px}.list>.row:only-child{border-radius:12px}
.row .ri{color:var(--muted)}
.row .rl{font-weight:500}
.row .rs{font-size:12px;color:var(--muted)}
.row .rv{margin-left:auto;display:flex;align-items:center;gap:8px}
.card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow),0 0 0 1px var(--line)}

/* home — shared page width and original type scale */
.home-page{position:relative;isolation:isolate}
.home-inner{position:relative;z-index:1}
.home-note{position:absolute;top:60px;left:40px;z-index:1;pointer-events:none}
.home-note-title{display:block;color:var(--ink);font-size:24px;font-weight:600;line-height:1.5;letter-spacing:.02em}
.home-note-caption{display:block;margin-top:8px;color:var(--ink-2);font-size:13px;line-height:1.7;white-space:nowrap}
.home-note::after{content:'';display:block;width:32px;height:2px;margin-top:18px;background:var(--primary)}
.home-brand{display:flex;flex-direction:column;align-items:center;text-align:center;padding:12px 0 28px;gap:12px}
.home-brand-icon{display:block;width:80px;height:80px;object-fit:contain;border-radius:22%;filter:drop-shadow(0 2px 5px rgba(51,75,47,.07))}
.home-brand h1{font-size:28px;font-weight:650;line-height:1.2;letter-spacing:-.02em}
.home-brand p{font-size:13px;line-height:1.7;color:var(--muted);text-wrap:balance}
.drop{width:100%;border:1px dashed var(--drop-line);border-radius:18px;height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:36px 24px 22px;background:var(--drop-bg);transition:border-color .2s,background .2s,box-shadow .2s}
.drop-wrap{position:relative}
.drop-preset{position:absolute;top:12px;right:12px;z-index:1;height:32px;padding:0 8px 0 10px;gap:6px;border-radius:8px;color:var(--ink-2);font-size:13px}
.drop-preset .i:first-child{color:var(--muted)}
.drop:hover{border-color:var(--primary);background:color-mix(in srgb,var(--drop-bg) 75%,var(--icon-bg));box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 3%,transparent)}
.drop.sm{height:220px}
.drop.over{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 12%,transparent)}
.drop-g{display:block;position:relative;width:46px;height:48px;color:var(--muted);margin-bottom:6px;transition:transform .25s var(--ease)}
.drop-g>.i{width:38px;height:44px;margin:0 auto}
.drop-plus{position:absolute;right:-3px;bottom:-1px;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#139A5C;color:white;box-shadow:0 0 0 2px var(--win)}
.drop-plus>.i{width:17px;height:17px}
.drop:hover .drop-g,.drop.over .drop-g{transform:translateY(-3px)}
.drop-t{font-size:19px;font-weight:600}
.drop-s{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 10px;font-size:12px;line-height:1.5;color:var(--muted);letter-spacing:.02em}
.drop-formats{display:inline-flex;gap:10px;white-space:nowrap}
.recent-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 4px 10px;min-height:28px}
.recent-head h2{font-size:12px;font-weight:600;color:var(--muted)}
.history-all{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 4px 0 8px;border-radius:7px;font-size:12px;color:var(--ink-2)}
.history-all:hover{background:var(--hover)}
.home-history{background:color-mix(in srgb,var(--surface) 92%,transparent);overflow:hidden}
.home-history .hrow:hover{background:color-mix(in srgb,var(--icon-bg) 50%,var(--surface))}
.hrow .hn{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .hx{min-width:0;flex:1;text-align:left}
.ficon{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);font-size:9px;font-weight:700;letter-spacing:.02em;flex:none;position:relative}
.ficon b{position:absolute;bottom:-3px;right:-5px;background:var(--ink);color:var(--win);border-radius:4px;padding:0 3px;font-size:8.5px;line-height:13px;font-weight:700}
.home-history .ficon{background:var(--icon-bg)}
.home-history .ficon>.i{width:18px;height:18px}
.home-history .ficon.file{background:#EEF4F8}
.home-history .ficon b{background:#0866F5;color:#fff}
.history-modal{width:min(640px,calc(100% - 48px));max-height:calc(100% - 80px);overflow:auto}
.history-modal .home-history{margin-top:20px}
[data-theme=dark] .home-brand-icon{filter:brightness(.85) drop-shadow(0 4px 8px rgba(0,0,0,.15))}
[data-theme=dark] .home-history .ficon.file{background:#283642}
@media (max-width:1180px){
 .home-note{top:58px;left:32px}
 .home-note-title{font-size:22px}
}
@media (max-width:860px){
 .home-note{display:none}
}
@media (max-width:600px){
 :root{--rail-w:56px}
 .rail button{width:40px;height:40px}
 .drop,.drop.sm{height:228px;padding:50px 12px 20px}
 .drop-preset{top:10px;right:8px;gap:5px;font-size:12px}
 .drop-preset>.i:first-child{width:15px;height:15px}
 .drop-s{font-size:12px;gap:4px 6px}.drop-formats{gap:6px}
 .recent-head{margin:20px 0 10px}
 .home-history .hrow{display:grid;grid-template-columns:30px minmax(0,1fr) 12px;gap:4px 8px;padding:10px;min-height:80px}
 .home-history .ficon{grid-column:1;grid-row:1 / 3;width:30px;height:34px;align-self:start;margin-top:2px}
 .home-history .ficon>.i{width:18px;height:18px}.home-history .ficon b{font-size:7px;line-height:12px;padding:0 2px;right:-2px}
 .home-history .hx{grid-column:2;grid-row:1;align-self:end}
 .home-history .hn{font-size:13px}.home-history .rs{font-size:11px}
 .home-history .pill{grid-column:2;grid-row:2;justify-self:start;height:22px;font-size:10px;padding:0 6px;max-width:100%;margin-top:2px}
 .home-history .history-chevron{grid-column:3;grid-row:1 / 3;width:12px}
 .history-modal{width:calc(100% - 24px);padding:18px 12px}
}

/* Viewport-anchored background; the home page scrolls independently above it. */
main:has(.home-page){isolation:isolate}
.home-page{z-index:1}
.home-flow{position:absolute;right:0;bottom:0;left:0;z-index:0;pointer-events:none;user-select:none}
.home-flow img{display:block;width:100%;height:auto;opacity:.4}
[data-theme=dark] .home-flow img{filter:invert(1) hue-rotate(180deg) saturate(.35);opacity:.22}
@media(max-width:600px){.home-flow img{opacity:.32}}

/* local model preparation */
.model-card{margin:0 0 16px;padding:18px 20px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left}
.model-head{display:flex;align-items:flex-start;gap:12px}
.model-icon{width:34px;height:34px;border-radius:9px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:none}
.model-copy{flex:1;min-width:0}.model-title{font-size:14px;font-weight:600;line-height:1.6}.model-tags{display:inline-flex;gap:6px;flex-wrap:wrap;margin-left:10px;vertical-align:middle}.model-section-note{margin-left:auto;font-weight:400;font-size:12px}.model-title .pill{font-weight:400}
.model-desc{font-size:12px;color:var(--ink-2);margin-top:3px;line-height:1.7;overflow-wrap:anywhere}
.model-meta{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.6}
.model-ready{display:inline-flex;align-items:center;justify-content:center;min-width:84px;height:34px;color:var(--muted);font-size:12px;font-weight:400}
.model-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.model-progress{margin-top:12px}.model-progress progress{display:block;width:100%;height:5px;border:0;border-radius:4px;overflow:hidden;accent-color:var(--primary);background:var(--line)}
.model-progress progress::-webkit-progress-bar{background:var(--line)}.model-progress progress::-webkit-progress-value{background:var(--primary)}
.model-progress-label{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px;margin-top:6px}
.model-pending{border-top:1px solid var(--line-2);margin-top:14px;padding-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.model-pending>span{flex:1;min-width:100px;font-size:12px;overflow-wrap:anywhere}
.model-card.intro .model-copy{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:20px}.model-card.intro .model-copy>div,.model-card.intro .model-copy>p{grid-column:1}.model-card.intro .model-actions{grid-column:2!important;grid-row:1 / 4;margin:0;align-self:center}.home-inner:has(.model-card) .home-brand{padding:0 0 20px;gap:8px}.home-inner:has(.model-card) .home-brand-icon{width:64px;height:64px}.home-inner:has(.model-card) .drop{height:220px}
.model-card.error .model-icon{color:var(--warn);background:var(--warn-soft)}
.model-gate{padding:16px 24px 0;flex:none}.model-gate .model-card{max-width:var(--page-w);margin:0 auto}
.model-shell{font-size:11px;height:28px;padding:0 8px;gap:5px;max-width:190px}
.model-shell span{overflow:hidden;text-overflow:ellipsis}
.model-shell[hidden]{display:none}
@media(max-width:600px){.model-card.intro .model-copy{display:block}.model-card.intro .model-actions{margin-top:12px}.model-card{padding:14px}.model-head{gap:10px}.model-gate{padding:12px 12px 0}.model-shell{max-width:110px}.model-meta{font-size:11px}.model-actions .btn{height:36px}}

/* Plugin model rows share the density and alignment of format rows. */
#modelPlugins .model-card{margin-bottom:8px;min-height:60px;padding:10px 14px 10px 16px}
#modelPlugins .model-head{align-items:center;gap:12px}
#modelPlugins .model-icon{width:32px;height:32px;border-radius:8px}
#modelPlugins .model-copy{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:16px}
#modelPlugins .model-copy>div,#modelPlugins .model-copy>p{grid-column:1}
#modelPlugins .model-title{font-weight:500;line-height:1.5}
#modelPlugins .model-meta{margin-top:2px;font-size:12px;line-height:1.5}
#modelPlugins .model-actions{grid-column:2!important;grid-row:1 / span 4;margin:0;align-self:center}
#modelPlugins .model-progress{margin-top:8px}
#modelPlugins .model-ready{min-width:84px;text-align:center}
@media(max-width:600px){
 #modelPlugins .model-card{padding:10px 12px}
 #modelPlugins .model-head{gap:10px}
 #modelPlugins .model-copy{column-gap:10px}
 #modelPlugins .model-meta{font-size:11px}
 #modelPlugins .model-actions .btn{height:34px;padding:0 10px;font-size:12px}
}

/* Home preparation notice: one text block with independently aligned action. */
.home-model-notice{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:12px;padding:14px 18px;min-height:62px}
.home-model-notice .model-icon{width:28px;height:28px;border-radius:8px}
.home-model-notice .model-desc{margin:0;font-size:13px;line-height:1.65;overflow-wrap:normal;text-wrap:pretty}
.home-model-notice .model-actions{margin:0;flex-wrap:nowrap}
.home-model-notice .btn{height:32px;padding:0 12px;font-size:12px}
@media(max-width:700px){
 .home-model-notice{grid-template-columns:24px minmax(0,1fr);gap:10px 12px;padding:14px 16px}
 .home-model-notice .model-icon{width:24px;height:24px;border-radius:7px;align-self:start}
 .home-model-notice .model-desc{font-size:12px;line-height:1.75}
 .home-model-notice .model-actions{grid-column:2;justify-self:start}
}

/* processing */
.proc{width:440px;padding:26px 26px 22px}
.proc-f{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.proc-f .fn{font-weight:600}.proc-f .fm{font-size:12px;color:var(--muted)}
.proc-f .ib{margin-left:auto}
.steps{display:flex;gap:6px}
.step{flex:1;height:4px;border-radius:2px;background:var(--line-2);overflow:hidden}
.step>i{display:block;height:100%;background:var(--primary);transition:width .2s linear}
.steps-l{display:flex;margin-top:10px;font-size:12px;color:var(--faint)}
.steps-l span{flex:1}.steps-l span.on{color:var(--ink);font-weight:500}.steps-l span.done{color:var(--muted)}

/* review */
.review{flex:1;display:grid;grid-template-columns:84px minmax(0,1fr) 336px;min-height:0}
.thumbs{border-right:1px solid var(--line);overflow:auto;padding:18px 0;display:flex;flex-direction:column;gap:26px;align-items:center}
.thumb{width:50px;aspect-ratio:1/1.414;background:var(--paper);border-radius:3px;box-shadow:0 0 0 1px var(--line);position:relative;flex:none;transition:box-shadow .15s}
.thumb::before{content:'';position:absolute;inset:14% 16%;background:repeating-linear-gradient(to bottom,#dcdcd8 0 1.5px,transparent 1.5px 5px)}
.thumb.on{box-shadow:0 0 0 2px var(--primary)}
.thumb i{position:absolute;height:3px;width:22%;border-radius:1px;background:var(--c);z-index:1}
.thumb i.im{height:16%;width:26%;background:#c7ccd3}
.thumb b{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted);font-weight:500}
.docwrap{display:flex;flex-direction:column;min-height:0;background:var(--surface-2);position:relative}
.doc-tools{height:50px;display:flex;align-items:center;padding:0 12px 0 16px;gap:6px;border-bottom:1px solid var(--line);background:var(--win)}
.doc-scroll{flex:1;overflow:auto;padding:28px 24px 80px;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){.doc-scroll{scroll-behavior:auto}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.paper{width:min(640px,100%);margin:0 auto 26px;background:var(--paper);color:var(--paper-ink);min-height:880px;padding:68px 70px 80px;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 2px 10px rgba(0,0,0,.06);border-radius:2px;font-family:"Songti SC","STSong","SimSun",serif;font-size:14px;line-height:2.05;position:relative;cursor:text}
.paper .d-title{text-align:center;font-size:23px;letter-spacing:.35em;font-weight:700;margin-bottom:4px}
.paper .d-meta{text-align:right;color:#777;font-size:12px;margin-bottom:22px}
.paper h4{font-size:14.5px;font-weight:700;margin:18px 0 2px}
.paper p.ind{text-indent:2em;text-align:justify}
.pgno{position:absolute;bottom:28px;left:0;right:0;text-align:center;font-size:11px;color:#9a9a9a;font-family:-apple-system,sans-serif}
.hit{border-radius:3px;padding:1px 1px;background:color-mix(in srgb,var(--c) 13%,transparent);box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--c) 75%,transparent);cursor:pointer;transition:background .15s,color .15s;scroll-margin:120px}
.hit:hover{background:color-mix(in srgb,var(--c) 24%,transparent)}
.hit.low::after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#D18A0F;vertical-align:super;margin-left:2px;box-shadow:0 0 0 1.5px var(--paper)}
.hit.keep{background:none;box-shadow:none;text-decoration:underline dotted #9aa0a6 1.5px;text-underline-offset:4px}
.hit.focus{outline:2px solid var(--ring);outline-offset:2px}
.fx .hit:not(.keep){color:transparent;background:var(--rdx);box-shadow:none;border-radius:1px}
.fx .hit.ph:not(.keep){color:#fff;background:#4a5058;font-family:-apple-system,"PingFang SC",sans-serif;font-size:.82em;padding:2px 4px;letter-spacing:.05em}
.fx .hit::after{display:none!important}
.fx .hit.keep{text-decoration:none}
.d-photo{float:right;width:104px;height:132px;margin:0 0 10px 18px;position:relative;cursor:pointer}
.d-seal{position:absolute;left:12px;top:-34px;width:120px;height:120px;cursor:pointer;mix-blend-mode:multiply;opacity:.88}
.imgm{outline:1.5px dashed #7b838d;outline-offset:3px}
.gone{background:#d6d8db;display:grid;place-items:center;font:500 11px -apple-system,"PingFang SC",sans-serif;color:#6b7078;mix-blend-mode:normal;opacity:1;outline:0}
.d-seal.gone{border-radius:0}
.d-sign{display:flex;gap:40px;margin-top:60px}
.d-sign>div{flex:1;position:relative;min-height:110px}
.d-sign p{white-space:nowrap}
.side{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--win)}
.side-head{padding:18px 18px 12px;display:flex;gap:12px;align-items:center}
.side-head .fn{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-head .fm{color:var(--muted);font-size:12px}
.sum{margin:0 14px;border-radius:10px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.sum-row{display:flex;align-items:center;gap:10px;padding:0 10px 0 12px;height:42px;border-top:1px solid var(--line-2);width:100%;color:var(--ink-2);font-size:13px}
.sum-row:first-child{border-top:0}
button.sum-row:hover{background:var(--hover)}
.sum>.sum-row:first-child{border-radius:10px 10px 0 0}.sum>.sum-row:last-child{border-radius:0 0 10px 10px}
.sum-row .i{color:var(--muted)}
.sum-row .v{color:var(--ink);font-weight:500}
.cats-h{display:flex;align-items:center;gap:8px;padding:20px 18px 6px;font-size:12px;font-weight:600;color:var(--muted)}
.cats{flex:1;overflow:auto;padding:0 8px 8px}
.cat{display:flex;align-items:center;border-radius:8px;transition:background .15s}
.cat:hover{background:var(--hover)}
.cat-main{flex:1;display:flex;align-items:center;gap:10px;height:40px;padding:0 4px 0 12px;min-width:0}
.cat-main .n{margin-left:auto;color:var(--ink);font-weight:500}
.cat .kept{font-size:11px;color:var(--muted);margin-left:6px}
.cat .sel{margin-right:4px;width:62px;justify-content:space-between}
.side-foot{padding:14px 16px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.out{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--muted);height:26px;border-radius:6px}
.out:hover{color:var(--ink);background:var(--hover)}
.warnline{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--warn);justify-content:center}
.overlay{position:absolute;inset:0;background:color-mix(in srgb,var(--win) 70%,transparent);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:5;animation:fade .2s}

/* done */
.donecard{width:440px;text-align:center;padding:40px 32px 28px}
.done-ic{width:60px;height:60px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok);animation:popin .35s var(--ease)}
.done-ic.warn{background:var(--warn-soft);color:var(--warn)}
.donecard h2{font-size:20px;font-weight:650}
.donecard .fn{margin-top:6px;color:var(--muted);font-size:13px;display:flex;justify-content:center;gap:6px;align-items:center}
.stats{display:flex;justify-content:center;flex-wrap:wrap;gap:14px 28px;margin:24px 0 26px}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats b{font-size:20px;font-weight:600}
.stats span{font-size:12px;color:var(--muted)}
.donecard .acts{display:flex;gap:8px;justify-content:center}
.foot-note{margin-top:22px;font-size:12px;color:var(--faint);display:flex;align-items:center;justify-content:center;gap:5px}
@keyframes popin{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

/* batch */
.pc-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px}
.big{font-size:40px;font-weight:650;letter-spacing:-.03em;line-height:1}
.big .of{font-size:22px;color:var(--faint);font-weight:500;letter-spacing:0}
.big .unit{font-size:16px;color:var(--muted);font-weight:500;margin-left:4px;letter-spacing:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:4px}
.pc-foot{display:flex;align-items:center;gap:10px;margin-top:22px}
.bhead{display:flex;align-items:flex-end;gap:6px;margin-bottom:18px}
.bhead .lbl{color:var(--muted);font-size:13px;margin-top:8px}
.eta{font-size:12px;color:var(--muted);margin-right:10px;align-self:center}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line-2);gap:2px}
.bar i{display:block;height:100%;transition:width .4s var(--ease);min-width:0}
.legend{display:flex;gap:18px;font-size:12px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend b{color:var(--ink);font-weight:500}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:28px 0 16px}
.tab{height:40px;padding:0 12px;color:var(--muted);position:relative;font-weight:500;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--ink)}
.tab[aria-selected=true]::after{content:'';position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;display:grid;place-items:center;font-weight:600}
[data-theme=dark] .badge{color:#1a1205}
.group{display:flex;align-items:center;gap:14px;padding:14px 14px 14px 16px;background:var(--surface);border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);margin-bottom:8px}
.group .gi{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--warn-soft);color:var(--warn);flex:none}
.group.block .gi{background:var(--bad-soft);color:var(--bad)}
.group .gx{min-width:0}
.group .gt{font-weight:550}
.group .gm{font-size:12px;color:var(--muted)}
.group .ga{margin-left:auto;display:flex;gap:4px;align-items:center}
.group.done{background:none;box-shadow:none;padding:6px 14px 6px 16px;margin:0;animation:none}
.group.done .gi{width:28px;height:28px;background:var(--ok-soft);color:var(--ok);border-radius:8px}
.group.done .gt{font-weight:400;color:var(--ink-2)}
.link{color:var(--primary);font-weight:500;font-size:13px;padding:4px 6px;border-radius:6px}
.link:hover{background:var(--primary-soft)}
.empty{text-align:center;padding:56px 0;color:var(--muted)}
.empty .g{color:var(--faint);display:flex;justify-content:center;margin-bottom:12px}
.banner{display:flex;align-items:center;gap:14px;padding:16px 16px 16px 18px;border-radius:12px;background:var(--ok-soft);margin-bottom:12px}
.banner.info{background:var(--primary-soft)}
.banner .bt{font-weight:600}
.banner .bs{font-size:12px;color:var(--ink-2)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border-radius:12px;box-shadow:inset 0 0 0 1px var(--line)}
.tbl th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 14px;border-bottom:1px solid var(--line-2);font-size:13px;white-space:nowrap}
.tbl td.nm{max-width:300px;overflow:hidden;text-overflow:ellipsis}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr.cl{cursor:pointer}.tbl tbody tr.cl:hover td{background:var(--surface-2)}
.tbl .r{text-align:right}
.ftools{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:8px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);color:var(--muted);width:220px}
.search input{border:0;background:none;outline:0;flex:1;min-width:0;color:var(--ink);font-size:13px}
.fchip{height:28px;padding:0 10px;border-radius:7px;font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.fchip:hover{background:var(--hover);color:var(--ink)}
.fchip[aria-pressed=true]{background:var(--ink);color:var(--win)}
.more{text-align:center;padding:12px;font-size:12px;color:var(--muted)}


/* batch review */
.hero{display:flex;align-items:center;gap:18px;padding:20px 20px 20px 24px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line),var(--shadow);margin-bottom:22px}
.hero .hn{font-size:28px;font-weight:650;letter-spacing:-.02em;line-height:1}
.hero .hn small{font-size:14px;color:var(--muted);font-weight:500;margin-left:6px;letter-spacing:0}
.hero .hs{font-size:12px;color:var(--muted);margin-top:8px}
.group.go{cursor:pointer;transition:background .15s}
.group.go:hover{background:var(--surface-2)}
.group .chev{color:var(--faint);display:grid;place-items:center;width:24px}
.rvw{flex:1;display:grid;grid-template-columns:280px minmax(0,1fr) 320px;min-height:0}
.rvw.fin{grid-template-columns:280px minmax(0,1fr)}
.rvq{border-right:1px solid var(--line);overflow:auto;padding:4px 8px 24px}
.rvg{display:flex;align-items:center;gap:8px;padding:16px 8px 6px;font-size:12px;font-weight:600;color:var(--muted)}
.rvg span:first-of-type{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rvg .n{margin-left:auto;font-weight:500;flex:none;color:var(--ink-2)}
.rvg .n .i{color:var(--ok)}
.rvi{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:8px;transition:background .15s}
.rvi:hover{background:var(--hover)}
.rvi[aria-current=true]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.04)}
.rvi .st{width:16px;height:16px;border-radius:50%;flex:none;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--faint)}
.rvi .st.ok{box-shadow:none;background:var(--ok-soft);color:var(--ok)}
.rvi .x{min-width:0;flex:1}
.rvi .fn{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rvi .fm{font-size:11.5px;color:var(--muted)}
.rvi.dn .fn{color:var(--muted)}
.rvi.sub{padding-left:34px;margin-top:-2px}
.rvi.sub .fm{font-size:12px;color:var(--ink-2)}
.rvi.dn.sub .fm{color:var(--muted)}
.rvi .dl{font-size:11.5px;color:var(--muted);flex:none}
.rvc{display:flex;flex-direction:column;min-height:0;background:var(--surface-2)}
.rvt{font-weight:600;margin-right:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.paper.pv{min-height:760px;cursor:default}
.tgt{outline:2px solid #D18A0F;outline-offset:4px;border-radius:3px;animation:tgt .9s var(--ease) 1}
@keyframes tgt{from{outline-offset:14px;outline-color:transparent}}
.rd{background:var(--rdx);color:transparent;border-radius:1px;user-select:none}
.shot{margin:18px 0 8px;border-radius:6px;background:#EEF1F5;box-shadow:0 0 0 1px #d9dde3;overflow:hidden;font-family:-apple-system,"PingFang SC",sans-serif;font-size:12px;color:#3a3f46;line-height:1.6;text-indent:0}
.shot .bar{height:22px;background:#e2e6ec;display:flex;gap:5px;align-items:center;padding:0 8px}
.shot .bar i{width:7px;height:7px;border-radius:50%;background:#c3c8cf}
.shot .bd{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.shot .bb{align-self:flex-start;background:#fff;border-radius:8px;padding:5px 10px;box-shadow:0 1px 1px rgba(0,0,0,.05)}
.shot .bb.me{align-self:flex-end;background:#d7ecff}
.cap{text-align:center;font-size:12px;color:#888;margin-bottom:10px}
.att{display:flex;align-items:center;gap:12px;margin:18px 0;padding:12px 14px;border-radius:8px;background:#f5f5f2;box-shadow:inset 0 0 0 1px #e3e3de;font-family:-apple-system,"PingFang SC",sans-serif;font-size:13px;width:280px;line-height:1.4;color:#333}
.att small{display:block;color:#888;font-size:11.5px}
.lh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1.5px solid #333;padding-bottom:6px;margin:-30px 0 24px}
.paper.scan{background:#E9E4DA;transform:rotate(-.4deg)}
.scanl{height:9px;border-radius:2px;background:#bdb5a6;margin:15px 0;filter:blur(.7px)}
.rvbox{flex:1;display:flex;align-items:center;justify-content:center;padding:40px}
.splitbar{display:flex;gap:4px;margin-top:20px}
.splitbar i{font-style:normal;height:32px;border-radius:6px;background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:500;display:grid;place-items:center;white-space:nowrap;min-width:96px}
.rvp{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--win)}
.rvp-h{display:flex;align-items:center;gap:10px;padding:18px 12px 16px 18px}
.rvp-h .t{font-weight:600;font-size:14px;line-height:1.35}
.gi2{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--warn-soft);color:var(--warn);flex:none}
.gi2.block{background:var(--bad-soft);color:var(--bad)}
.rvp-b{flex:1;overflow:auto;padding:4px 18px 18px}
.acts-v{display:flex;flex-direction:column;gap:8px;margin-top:22px}
.acts-v .btn{justify-content:space-between;height:44px;font-size:14.5px;padding:0 12px 0 16px;border-radius:10px}
.acts-v .btn-p kbd{background:rgba(255,255,255,.18);color:inherit;box-shadow:none}
.rest{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--ink-2);cursor:pointer}
.rest input{accent-color:var(--primary);width:15px;height:15px}
.ask{font-size:12px;font-weight:600;color:var(--muted);margin:24px 0 8px}
.acts-v{display:flex;flex-direction:column;gap:8px;margin-top:0}
.dopt{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 14px 0 12px;border-radius:10px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-size:14.5px;font-weight:500;transition:box-shadow .15s,background .15s}
.dopt:hover,.dopt:focus-visible{box-shadow:inset 0 0 0 1.5px var(--primary)}
.dopt .key{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:var(--surface-2);font-size:12px;font-weight:650;color:var(--ink-2);flex:none;transition:background .15s,color .15s}
.dopt:hover .key{background:var(--primary);color:var(--on-primary)}
.dopt .dn2{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
.dopt .ck{margin-left:auto;color:var(--primary)}
.dopt .dn2+.ck{margin-left:8px}
.dopt.on{background:var(--primary-soft);box-shadow:inset 0 0 0 1.5px var(--primary)}
.dopt.on .key{background:var(--primary);color:var(--on-primary)}
.navs{display:flex;gap:8px;margin-top:20px}
.navs .btn{flex:1}
.rvw.cmp{grid-template-columns:minmax(0,1fr) 320px}
.rvw.cmp .rvq{display:none}
.doc-scroll.cmpv{padding:0 20px 80px}
.still .tgt{animation:none}
.keepv{text-decoration:underline dotted #9aa0a6 1.5px;text-underline-offset:4px}
.shot{height:156px}
.shot .bd{overflow:hidden}
.shot-gone{height:156px;margin:18px 0 8px;border-radius:6px;background:#d6d8db;display:grid;place-items:center;font:500 12px -apple-system,"PingFang SC",sans-serif;color:#6b7078}
.att.gone2{background:#e9eaec;box-shadow:none;color:#7b8088}
.scan-gone{position:absolute;inset:0;background:#cfd2d6;display:grid;place-items:center;font:500 13px -apple-system,"PingFang SC",sans-serif;color:#5f646b;border-radius:2px}
.paper.skipd::after{content:'此文件不导出';position:absolute;inset:0;background:rgba(238,238,235,.86);display:grid;place-items:center;font:600 15px -apple-system,"PingFang SC",sans-serif;color:#6b6f76;border-radius:2px}
.rvp-f{border-top:1px solid var(--line);padding:14px 18px 16px}
.mini{height:4px;border-radius:2px;background:var(--line-2);overflow:hidden;margin-top:8px}
.mini i{display:block;height:100%;background:var(--ok);transition:width .3s var(--ease)}
.keyhint{display:flex;align-items:center;gap:4px;margin-top:12px;font-size:11.5px;color:var(--muted)}
.keyhint kbd{margin-right:2px}
.lowrow{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px 0 12px;border-radius:8px;font-size:13px;transition:background .15s}
.lowrow:hover{background:var(--hover)}
.lowrow .v{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.lowrow.seen .v{color:var(--muted)}
.lowrow.seen .i{color:var(--ok)}
.cats .cats-h{padding:14px 10px 6px}
@media (max-width:1180px){.rvw{grid-template-columns:minmax(0,1fr) 300px}.rvw.fin{grid-template-columns:1fr}.rvq{display:none}}

/* redaction styles (all opaque) */
:root,[data-redact=black]{--rdx:var(--redact)}
[data-redact=gray]{--rdx:#5c6169}
[data-redact=mosaic]{--rdx:conic-gradient(#2c3036 25%,#535961 0 50%,#3b4047 0 75%,#666c74 0) 0 0/8px 8px}
[data-redact=stripe]{--rdx:repeating-linear-gradient(-45deg,#16181b 0 3px,#43484f 3px 6px)}
.rstyles{display:flex;gap:4px}
.rst{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 8px 6px;border-radius:8px;font-size:11.5px;color:var(--muted);min-width:58px;transition:background .15s,box-shadow .15s,color .15s}
.rst:hover{background:var(--hover);color:var(--ink)}
.rst[aria-checked=true]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--primary)}
.rst .pp{display:block;background:var(--paper);padding:5px 6px;border-radius:4px;box-shadow:0 0 0 1px var(--line)}
.rsw{display:block;width:36px;height:11px;border-radius:1px;background:var(--rdx)}

 });
 return{hits,imgs,pages};

/* ---------- shell ---------- */
function railHtml(){
 const cur={home:'home',single:'home',batch:'home',presets:'presets',plugins:'plugins',settings:'settings',history:'home'}[S.view];
 const b=(v,ic,tip,extra='')=>'<button data-a="go" data-v="'+v+'" data-tip="'+tip+'" aria-label="'+tip+'" '+(cur===v?'aria-current="page"':'')+'>'+I(ic,19)+extra+'</button>';
 const pend=S.batch&&S.view!=='batch'&&batchStatus()[0]==='warn';
 return b('home','inbox','任务',pend?'<span class="dotb"></span>':'')+b('presets','layers','方案')+b('plugins','puzzle','插件')+'<span class="sp"></span>'+b('settings','gear','设置');
}
function titleHtml(){
 const s=S.single,B=S.batch;
 if(S.view==='history')return '<span>'+esc(S.historyResult.phase==='manifest'?'导出清单':S.historyResult.entry.name)+'</span>';
 if(S.view==='single'&&s)return '<span>'+esc(s.phase==='done'&&s.resultPhase==='manifest'?'导出清单':s.name)+'</span>';
 if(S.view==='batch'&&B)return '<span>'+(B.phase==='manifest'?'导出清单':B.phase==='review'?'人工复核':B.phase==='result'?esc(B.title):'批次 · '+fmt(B.n)+' 份')+'</span>';
 return {presets:'方案',plugins:'插件',settings:'设置'}[S.view]||'<span style="display:flex;align-items:center;gap:8px">'+LOGO(16)+'Tacet</span>';
}
function openSubpage(view,state={}){
 S.navStack.push({view:S.view,ptab:S.ptab,presetSel:S.presetSel,rsSel:S.rsSel});
 Object.assign(S,{view},state);render();
}
function backHtml(){
 const back=(action,label,value='')=>'<button class="btn btn-g tb-back" data-a="'+action+'"'+(value?' data-v="'+value+'"':'')+' data-tip="'+esc(label)+'" aria-label="'+esc(label)+'">'+I('chev-l',18)+'返回</button>';
 if(S.view==='history')return S.historyResult.phase==='manifest'?back('historyPhase','返回结果','result'):back('go','返回任务','home');
 if(S.view==='single'&&S.single?.phase==='done'&&S.single.resultPhase==='manifest')return back('singlePhase','返回结果','result');
 if(S.navStack.length){const r=S.navStack[S.navStack.length-1];return back('ret','返回 '+(r.view==='single'&&S.single?S.single.name:{home:'任务',presets:r.ptab==='rules'?'规则':'方案',plugins:'插件',settings:'设置'}[r.view]||'上一页'))}
 if(S.view==='single'&&S.single&&S.single.from==='batch')return back('backBatch','返回批次');
 if(S.view==='batch'&&S.batch&&['manifest','review'].includes(S.batch.phase)){const r=machineDone();return back('bphase',r?'返回结果':'返回批次',r?'result':'run')}
 if(['single','batch'].includes(S.view))return back('go','返回任务','home');
 return '';
}
function saveUi(){
 const a=document.activeElement;const st={};
 $$('[data-keep]').forEach(e=>st[e.id]=e.scrollTop);
 return{st,fid:a&&a.id,ss:a&&a.selectionStart};
}
function restoreUi(u){
 Object.entries(u.st).forEach(([id,t])=>{const e=document.getElementById(id);if(e){e.style.scrollBehavior='auto';e.scrollTop=t;e.style.scrollBehavior=''}});
 if(u.fid){const e=document.getElementById(u.fid);if(e){e.focus();try{e.setSelectionRange(u.ss,u.ss)}catch(_){}}}
}
function render(){
 const u=saveUi();
 document.documentElement.dataset.theme=S.theme;document.documentElement.dataset.redact=S.set.redact||'black';
 $('#rail').innerHTML=railHtml();
 $('#tbTitle').innerHTML=titleHtml();
 $('#tbBack').innerHTML=backHtml();
 const v=S.view;
 $('#main').innerHTML=v==='home'?vHome():v==='history'?vHistoryResult():v==='single'?vSingle():v==='batch'?vBatch():v==='presets'?vPresets():v==='plugins'?vPlugins():vSettings();
 if(S.modelPending&&v!=='home'&&v!=='plugins'&&!(v==='batch'&&S.batch?.phase==='precheck'))$('#main').insertAdjacentHTML('afterbegin','<div class="model-gate">'+modelCard()+'</div>');
 patchModelShell();
 restoreUi(u);
 if(v==='single'&&S.single&&S.single.phase==='review')bindDoc();
 if(v==='home')bindDrop();
 if(v==='batch'&&S.batch&&S.batch.phase==='review')bindRv();
}

/* ---------- layer: pop / modal / drawer / toast ---------- */
let popClose=null;
function closePop(){const p=$('#layer .pop');if(p)p.remove();if(popClose){const f=popClose;popClose=null;f()}}
function openPop(anchor,html,opt={}){
 closePop();
 const L=$('#layer'),w=$('#win').getBoundingClientRect();
 const el=document.createElement('div');el.className='pop '+(opt.cls||'');el.innerHTML=html;el.setAttribute('role',opt.role||'menu');
 L.appendChild(el);
 const r=anchor.getBoundingClientRect?anchor.getBoundingClientRect():anchor;
 const pw=el.offsetWidth,ph=el.offsetHeight;
 let x=opt.alignRight?r.right-w.left-pw:r.left-w.left;let y=r.bottom-w.top+6;
 if(y+ph>w.height-8)y=r.top-w.top-ph-6;
 x=Math.max(8,Math.min(x,w.width-pw-8));
 el.style.left=x+'px';el.style.top=y+'px';
 popClose=opt.onClose||null;
 const f=el.querySelector('button,input');if(f&&opt.focus!==false)f.focus({preventScroll:true});
 return el;
}
let menuCb=null;
function menu(anchor,items,cb,opt={}){
 menuCb=cb;
 const h=items.map((it,i)=>it==='-'?'<div class="msep"></div>':it.h?'<div class="mh">'+it.h+'</div>':
  '<button class="mi '+(it.d?'d':'')+'" data-a="menuPick" data-v="'+i+'" role="menuitem">'+(it.ic?I(it.ic,15):'')+'<span>'+it.l+'</span>'+(it.s?'<small>'+it.s+'</small>':'')+(it.on?'<span class="ck">'+I('check',14)+'</span>':'')+'</button>').join('');
 menuCb.items=items;
 openPop(anchor,h,opt);
}
let historyTrigger=null;
function closeModal(){const history=$('#layer .history-modal');$$('#layer .scrim,#layer .modal,#layer .drawer').forEach(e=>e.remove());S.drawer=null;if(history&&historyTrigger&&historyTrigger.isConnected)historyTrigger.focus();historyTrigger=null}
function modal(html){closePop();closeModal();const L=$('#layer');L.insertAdjacentHTML('beforeend','<div class="scrim" data-a="closeModal"></div><div class="modal" role="dialog" aria-modal="true">'+html+'</div>');const f=$('#layer .modal input,#layer .modal .btn-p');if(f)f.focus()}
function drawer(html){closePop();$$('#layer .drawer,#layer .scrim').forEach(e=>e.remove());$('#layer').insertAdjacentHTML('beforeend','<div class="scrim" data-a="closeModal"></div><div class="drawer" role="dialog" aria-modal="true">'+html+'</div>')}
let toastT=null,toastUndo=null;
function toast(msg,undo){
 const old=$('#layer .toast');if(old)old.remove();clearTimeout(toastT);toastUndo=undo||null;
 $('#layer').insertAdjacentHTML('beforeend','<div class="toast" role="status">'+msg+(undo?'<button data-a="toastUndo">撤销</button>':'')+'</div>');
 toastT=setTimeout(()=>{const t=$('#layer .toast');if(t)t.remove();toastUndo=null},undo?5000:2600);
}

/* ---------- local models (prototype: no requests or model files) ---------- */
const MODEL_LABELS={missing:'待下载',downloading:'下载中',paused:'已暂停',verifying:'校验中',loading:'准备中',ready:'已就绪',error:'需处理'};
const MODEL_ERRORS={
 offline:['下载已中断','网络连接不可用，已下载的部分会保留。连接网络后继续下载。','继续下载'],
 disk:['可用空间不足','请先释放磁盘空间，再重试。安装需要的空间包含下载文件、展开文件与临时副本。','检查空间并重试'],
 integrity:['模型文件校验未通过','文件不完整或与当前应用版本不匹配，尚未加载。请重新下载此模型。','重新下载'],
 load:['模型未能启动','文件校验已通过，但本地试运行失败。请关闭占用内存较多的应用后重试；仍失败时可重新下载。','重新准备']
};
const modelTimers=new Map();
function getPreset(name){return S.presets.find(p=>p.name===name)||S.presets[0]}
function presetNeedsModel(name){return getPreset(name).det==='model'}
function modelById(id){return S.models.find(m=>m.id===id)}
function presetModelId(name){return presetNeedsModel(name)?getPreset(name).model:null}
function contextModelId(){
 if(S.modelPending)return S.modelPending.modelId;
 if(S.view==='batch'&&S.batch)return S.batch.modelId||presetModelId(S.batch.preset);
 if(S.view==='single'&&S.single)return S.single.modelId||presetModelId(S.single.preset);
 return presetModelId(S.homePreset);
}
function modelBusy(id){const xs=id?[modelById(id)]:S.models;return xs.some(m=>m&&['downloading','verifying','loading'].includes(m.status))}
function stopModelTimers(){modelTimers.forEach(t=>clearInterval(t));modelTimers.clear()}
function stopModelTimer(id){clearInterval(modelTimers.get(id));modelTimers.delete(id)}
function resetModels(status='ready'){stopModelTimers();S.models.forEach(m=>Object.assign(m,{status,progress:status==='ready'?100:0,error:null}));S.modelPending=null}
function documentBusy(){return !!(S.single&&['processing','exporting'].includes(S.single.phase))||!!(S.batch&&S.batch.phase!=='precheck'&&S.batch.files.some(f=>['proc','queue','ready'].includes(f.st)))}
function patchModelShell(){
 const e=$('#modelShell');
 const show=S.models.length>0&&S.models.every(m=>m.status==='missing');
 e.hidden=!show;
 e.innerHTML=I('cpu',13)+'<span>模型待下载</span>';
 e.setAttribute('aria-label','模型待下载，查看模型插件');e.dataset.v='';
 const n=$('#networkState'),note=S.models.some(x=>x.status==='downloading')?'正在下载模型 · 文档留在本机':'本机处理 · 未联网';
 n.dataset.tip=note;n.setAttribute('aria-label',note);
}
function homeModelGuide(){
 if(S.modelPending)return modelCard(false,S.modelPending.modelId);
 const ready=S.models.filter(m=>m.status==='ready').length,busy=S.models.filter(m=>modelBusy(m.id)),errors=S.models.filter(m=>m.status==='error'),paused=S.models.filter(m=>m.status==='paused');
 if(ready&&!busy.length&&!errors.length&&!paused.length)return '';
 const desc=busy.length?'正在准备识别模型，可先选择文档。':errors.length?'模型准备需要处理，请前往插件页查看。':paused.length?'模型下载已暂停，已下载的部分会保留。':'请先下载隐私识别模型，以便支持更优识别效果和本地离线使用';
 return '<section class="model-card home-model-notice '+(errors.length?'error':'')+'" data-home-guide aria-label="模型准备引导"><span class="model-icon" aria-hidden="true">'+I(errors.length?'alert':'cpu',16)+'</span><p class="model-desc" role="status" aria-live="polite" aria-atomic="true">'+desc+'</p><div class="model-actions"><button class="btn btn-p" data-a="modelManage">'+(busy.length?'查看进度':errors.length?'查看并处理':paused.length?'继续准备':'前往下载')+'</button></div></section>';
}
function modelCard(manage=false,id=contextModelId()){
 // A rules-only task can still wait for an unrelated resource operation to finish.
 if(!id)id=S.models.find(m=>modelBusy(m.id))?.id;
 const m=modelById(id),p=S.modelPending?.modelId===id?S.modelPending:null;
 if(!m)return id?'<section class="model-card error" data-model="'+esc(id)+'" aria-label="模型不可用"><div class="model-title">所选模型不可用</div><p class="model-desc">请在插件页检查此模型是否仍受支持，原任务不会自动替换模型。</p><button class="btn btn-s" data-a="modelManage">查看模型</button></section>':'';
 const st=m.status,error=st==='error';
 if(st==='ready'&&!p&&!manage)return '';
 const detail=error?MODEL_ERRORS[m.error]||MODEL_ERRORS.offline:null;
 const title=manage?esc(m.name):detail?detail[0]:({missing:'此方案需要的模型尚未下载',downloading:'正在下载此方案需要的模型',paused:'模型下载已暂停',verifying:'下载完成，正在校验',loading:'正在准备本地识别',ready:'此方案需要的模型已就绪'})[st];
 const desc=detail?detail[1]:({missing:'下载后支持本地离线使用，文档始终留在本机。',downloading:'可以先选择文档、浏览方案。此模型准备好后再开始检测。',paused:'已下载的部分会保留，继续时无需从头下载。',verifying:'正在检查此模型的文件是否完整，完成后进行本地试运行。',loading:'正在加载并用内置样例试运行，不会读取你的文档。',ready:'已通过文件校验与本地试运行，支持本地离线使用。'})[st];
 const btn=(a,t,cls='btn-s')=>'<button class="btn '+cls+'" data-a="'+a+'" data-v="'+esc(m.id)+'">'+t+'</button>';
 let acts='';
 if(st==='missing'||st==='paused'||error){acts+=btn(error&&m.error==='load'?'modelPrepare':'modelDownload',detail?detail[2]:st==='paused'?'继续下载':'下载模型','btn-p');if(error&&m.error==='load')acts+=btn('modelDownload','重新下载','btn-g')}
 if(st==='downloading')acts+=btn('modelPause','暂停','btn-g');
 if(!manage)acts+=btn('modelManage','查看模型','btn-g');
 if(manage&&st==='ready')acts+='<span class="model-ready" role="status">已就绪</span>';
 const tags=manage&&!['missing','ready'].includes(st)?'<span class="pill '+(error?'warn':'ghost')+'">'+MODEL_LABELS[st]+'</span>':'';
 const progress=st==='downloading'||st==='paused'?'<div class="model-progress"><progress max="100" value="'+m.progress+'" aria-label="'+esc(m.name)+' 下载进度"></progress><div class="model-progress-label" style="justify-content:flex-end"><span class="num">'+m.progress+'%</span></div></div>':'';
 return '<section class="model-card '+(error?'error':st==='missing'||manage&&st==='ready'?'intro':'')+'" data-model="'+esc(m.id)+'" data-manage="'+manage+'" aria-label="'+esc(m.name)+' 模型准备"><div class="model-head"><span class="model-icon">'+I(manage?'cpu':error?'alert':st==='ready'?'check':'cpu',18)+'</span><div class="model-copy"><div class="model-title" role="status" aria-live="polite" aria-atomic="true">'+title+(tags?'<span class="model-tags">'+tags+'</span>':'')+'</div>'+(manage&&!error?'':'<p class="model-desc">'+(manage&&error?esc(detail[0])+' · ':'')+desc+'</p>')+'<div class="model-meta">'+(manage?'':esc(p?.preset||'本次任务')+' · '+esc(m.name)+' · ')+esc(m.version)+' · '+esc(m.variant)+' · '+esc(m.languages)+(st==='missing'&&m.weightMiB?' · 权重约 '+m.weightMiB+' MiB':'')+'</div>'+
 progress+(acts?'<div class="model-actions">'+acts+'</div>':'')+'</div></div>'+
 (p?'<div class="model-pending"><span>'+esc(p.label)+(st==='ready'?' · 准备好了，可以继续':' · 等待 '+esc(m.name)+' 准备，尚未开始检测')+'</span>'+btn('modelCancel','取消本次操作','btn-g')+'<button class="btn btn-p" data-a="modelContinue" '+(st==='ready'&&!modelBusy()?'':'disabled')+'>继续处理</button></div>':'')+'</section>';
}
function needModel(preset,go,label,boundId){
 const id=boundId||presetModelId(preset),m=modelById(id);
 if((!id||m?.status==='ready')&&!modelBusy())return true;
 if(S.modelPending){toast('请先继续或取消上一次等待的操作');return false}
 const waitingId=id||S.models.find(x=>modelBusy(x.id))?.id;
 S.modelPending={go,label,preset,modelId:waitingId};render();
 const card=$('.model-card');if(card)card.scrollIntoView({block:'nearest'});
 return false;
}
function modelRefresh(){
 const u=saveUi(),a=document.activeElement,action=a&&a.dataset.a,id=a&&a.dataset.v;
 if(S.view==='batch'&&S.batch?.phase==='precheck')render();
 else $$('.model-card').forEach(e=>{const h=e.hasAttribute('data-home-guide')?homeModelGuide():modelCard(e.dataset.manage==='true',e.dataset.model);if(h)e.outerHTML=h;else e.remove()});
 patchModelShell();restoreUi(u);
 if(action){const e=$$('[data-a="'+action+'"]').find(x=>x.dataset.v===id);if(e)e.focus({preventScroll:true});else if(!modelBusy())$('[data-a="modelContinue"],#modelShell')?.focus({preventScroll:true})}
}
function modelTick(id=contextModelId()){
 const m=modelById(id);if(!m)return;
 if(m.status==='downloading'){m.progress=Math.min(100,m.progress+5);if(m.progress===100)m.status='verifying'}
 else if(m.status==='verifying')m.status='loading';
 else if(m.status==='loading'){m.status='ready';stopModelTimer(id);toast(esc(m.name)+' 已就绪'+(S.modelPending?.modelId===id?'，可以继续处理':'，可以离线使用'))}
 modelRefresh();
}
function modelDownload(id=contextModelId()){
 const m=modelById(id);if(!m)return;
 if(documentBusy()){toast('请先完成或停止当前文档处理，再下载模型');return}
 if(modelBusy(id))return;
 if(m.error==='integrity'||m.error==='load')m.progress=0;
 m.error=null;m.status='downloading';stopModelTimer(id);render();modelTimers.set(id,setInterval(()=>modelTick(id),500));
}
function modelPrepare(id=contextModelId()){
 const m=modelById(id);if(!m)return;
 if(documentBusy()){toast('请先完成或停止当前文档处理，再准备模型');return}

/* ---------- home ---------- */
function liveHistory(){
 const out=[];const B=S.batch;const s=S.single&&S.single.from==='batch'?(S.behind&&S.behind.s):S.single;
 if(B){const[st,stl]=batchStatus();out.push({k:'batch',name:B.title,meta:fmt(B.n)+' 份',st,stl,when:'刚刚',live:'batch'})}
 if(s&&s.phase!=='done')out.push({k:'file',ext:s.ext,name:s.name,meta:s.pages.length+' 页',st:s.phase==='review'?'warn':'run',stl:s.phase==='review'?'待确认':'处理中',when:'刚刚',live:'single'});
 return out.concat(S.history);
}
/* Completed history is viewed separately so active tasks keep their slots and timers. */
function openHistoryResult(x){
 let data=x.live==='batch'?S.batch:x.saved;
 if(!data){
  if(x.k==='file')data=Object.assign({name:x.name,ext:x.ext||extOf(x.name),out:'桌面 / 已脱敏',preset:'通用办公脱敏',phase:'done'},buildDoc());
  else{const n=parseInt(x.meta.replace(/,/g,''))||0;data={title:x.name,n,out:'桌面 / 已脱敏',phase:'result',files:Array.from({length:n},(_,i)=>({i,id:'T'+String(i+1).padStart(4,'0'),ext:'pdf',st:'done'}))}}
  x.saved=data;
 }
 S.historyResult={entry:x,data,phase:'result'};S.navStack=[];S.view='history';render();
}
function vHistoryResult(){
 const r=S.historyResult;
 return r.phase==='manifest'?vManifest(r.entry.k==='file'?singleManifest(r.data):r.data):r.entry.k==='file'?vDone(r.data):vResult(r.data);
}
function historyRows(h){
 return h.map((x,i)=>'<button class="row hrow" data-a="openHist" data-v="'+i+'">'+
  (x.k==='batch'?'<span class="ficon">'+I('layers',25)+'</span>':fileIcon(x.ext||'pdf'))+
  '<span class="hx"><span class="hn" style="display:block">'+esc(x.name)+'</span><span class="rs" style="display:block">'+esc(x.meta)+' · '+esc(x.when)+'</span></span>'+
  '<span class="pill '+({done:'ok',warn:'warn',run:'pri',keep:'ghost',idle:'pri',stop:'ghost',part:'ghost'}[x.st]||'ghost')+'">'+(x.st==='run'?'<span class="dot"></span>':'')+esc(x.stl)+'</span>'+I('chev-r',18).replace('class="i"','class="i history-chevron"')+'</button>').join('');
}
function vHome(){
 if(!S.presets.some(p=>p.name===S.homePreset))S.homePreset=S.presets[0].name;
 const h=liveHistory();
 return '<div class="home-flow" aria-hidden="true"><img src="'+HOME_FLOW+'" width="2070" height="365" alt="" draggable="false"></div><div class="page home-page">'+
  '<aside class="home-note" aria-label="敏感信息，止于此处。本地处理，守护更安心。"><strong class="home-note-title">敏感信息，<br>止于此处。</strong><span class="home-note-caption">本地处理，守护更安心。</span></aside>'+
  '<div class="page-inner home-inner"><header class="home-brand"><img class="home-brand-icon" src="'+HOME_ICON+'" width="80" height="80" alt="Tacet 幼苗角色 Logo"><h1>Tacet</h1><p>该静默处，自有分寸</p></header>'+
  homeModelGuide()+'<div class="drop-wrap" id="drop"><button class="drop '+(h.length?'sm':'')+'" data-a="pick" aria-label="选择待脱敏文档，或将文档拖入此处"><span class="drop-g" aria-hidden="true">'+I('file',56,1.5)+'<span class="drop-plus">'+I('plus',23,1.75)+'</span></span><span class="drop-t">拖入文档</span><span class="drop-s"><span>或点击选择 ·</span><span class="drop-formats"><span>DOCX</span><span>PDF</span><span>TXT</span><span>CSV</span><span>JSONL</span></span></span></button>'+
  '<button class="sel drop-preset" data-a="homePreset" aria-label="脱敏方案：'+esc(S.homePreset)+'">'+I('layers',18)+'<span>'+esc(S.homePreset)+'</span>'+I('chev-d',15)+'</button></div>'+
  (h.length?'<section aria-labelledby="recentTitle"><div class="recent-head"><h2 id="recentTitle">最近</h2><button class="history-all" data-a="allHistory">查看全部 '+I('chev-r',16)+'</button></div><div class="list home-history">'+historyRows(h.slice(0,3))+'</div></section>':'')+
 '</div></div>';
}
function bindDrop(){
 const d=$('#drop');if(!d)return;const z=d.querySelector('.drop');
 ['dragenter','dragover'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();z.classList.add('over')}));
 d.addEventListener('dragleave',ev=>{ev.preventDefault();if(!d.contains(ev.relatedTarget))z.classList.remove('over')});
 d.addEventListener('drop',ev=>{ev.preventDefault();z.classList.remove('over');takeFiles([...ev.dataTransfer.files].map(f=>({name:f.name,size:f.size})))});
}

function takeFiles(fs){
 if(!fs.length)return;
 if(S.modelPending){toast('请先继续或取消已选择的操作，再选择其他文档');return}
 const preset=S.homePreset,modelId=presetModelId(preset);
 if(fs.length===1){const go=()=>needSlot('single',()=>newSingle(fs[0].name,fs[0].size,{preset,modelId}));if(needModel(preset,go,fs[0].name,modelId))go()}else needSlot('batch',()=>newBatch(fs.map(f=>f.name)));
}
/* one single + one batch at a time; an unfinished task is never replaced silently */
function slotBusy(kind){
 if(kind==='single'){const s=S.single&&S.single.from==='batch'?(S.behind&&S.behind.s):S.single;return s&&s.phase!=='done'?s:null}
 const B=S.batch;return B&&!(['result','manifest'].includes(B.phase)&&settled())?B:null;
}
function needSlot(kind,go){
 const cur=slotBusy(kind);
 if(!cur){if(kind==='batch'&&S.batch)archiveBatch();go();return}
 S.slotKind=kind;S.slotGo=go;
 if(kind==='single'){
  if(cur.phase!=='review'){toast('「'+esc(cur.name)+'」正在处理，请稍候');return}
  modal('<h3>「'+esc(cur.name)+'」还未导出</h3><div class="ms">保存到“最近”，稍后可继续确认</div><div class="mf"><button class="btn btn-g" data-a="closeModal" style="margin-right:auto">取消</button><button class="btn btn-s" data-a="slotView">返回该文件</button><button class="btn btn-p" data-a="slotPark">保存并继续</button></div>');
  return;
 }
 const pre=cur.phase==='precheck',d=keepDays(cur);
 modal('<h3>'+(pre?'当前批次还未开始':'当前批次还在进行')+'</h3><div class="ms">「'+esc(cur.title)+'」· '+batchStatus()[1]+'</div><div class="mb">'+(pre?'替换后，当前批次的设置不会保留。':'当前批次将暂停并加密保存 '+d+' 天，可在“最近”中继续。')+'</div><div class="mf"><button class="btn btn-g" data-a="closeModal" style="margin-right:auto">取消</button><button class="btn btn-s" data-a="slotView">查看当前批次</button><button class="btn btn-p" data-a="slotPark">'+(pre?'替换':'保存并继续')+'</button></div>');
}
function keepDays(B){return B&&B.keep!=='0'?B.keep:'7'}
function parkSingle(){const s=S.single;S.history.unshift({k:'file',ext:s.ext,name:s.name,meta:s.pages.length+' 页',st:'warn',stl:'待确认',when:'刚刚',saved:s,undo:S.undo,park:true});S.single=null;S.undo=[]}
function parkBatch(d){const B=S.batch;clearInterval(bT);B.paused=true;S.history.unshift({k:'batch',name:B.title,meta:fmt(B.n)+' 份',st:'keep',stl:'已保存 · '+d+' 天后清理',when:'刚刚',saved:B});S.batch=null}
function archiveBatch(){const B=S.batch;const[st,stl]=batchStatus();clearInterval(bT);S.history.unshift({k:'batch',name:B.title,meta:fmt(B.n)+' 份',st,stl,when:'刚刚',saved:B});S.batch=null}
function resumeBatch(x){if(!needModel(x.saved.preset,()=>resumeBatch(x),x.name,x.saved.modelId))return;S.history=S.history.filter(h=>h!==x);S.batch=x.saved;const B=S.batch;B.paused=false;clearInterval(bT);if(B.phase!=='precheck')bT=setInterval(tick,240);S.view='batch';render()}

/* ---------- single ---------- */
function extOf(n){const m=/\.([a-z0-9]+)$/i.exec(n);return m?m[1].toLowerCase():'pdf'}
function sizeStr(b){return b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB'}

let procT=null;

 clearInterval(procT);const s=S.single;
 procT=setInterval(()=>{
  if(S.single!==s&&!(S.behind&&S.behind.s===s)){clearInterval(procT);return}
  s.sp+=s.stage===0?9:4;

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
 const el=ev.target.closest('[data-a]');
 const sel=window.getSelection();const selecting=sel&&!sel.isCollapsed&&ev.target.closest('#doc');
 if(!selecting&&!ev.target.closest('#layer .pop')&&!(el&&['hit','imgMenu'].includes(el.dataset.a)))closePop();
 if(!el||el.disabled)return;
 const f=A[el.dataset.a];if(f)f(el,ev);
});
document.addEventListener('change',ev=>{
 if(ev.target.id==='sameAll'){S.single.sameAll=ev.target.checked}
 if(ev.target.id==='rvAll'){S.batch.rv.all=ev.target.checked}
 if(ev.target.id==='fileIn'){takeFiles([...ev.target.files].map(f=>({name:f.name,size:f.size})));ev.target.value=''}
});
document.addEventListener('input',ev=>{
 if(ev.target.dataset.in==='fq'){S.batch.q=ev.target.value.trim();S.batch.lim=60;patchBatch(true)}
});
document.addEventListener('keydown',ev=>{
 if(ev.key==='Tab'){const m=$('#layer .history-modal');if(m){const fs=$$('button:not([disabled])',m),first=fs[0],last=fs[fs.length-1];if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus()}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus()}return}}
 if(ev.key==='Escape'){if($('#layer .pop')){closePop();return}if($('#layer .modal,#layer .drawer')){closeModal();return}if(S.single)S.single.focus=-1;}
 if(ev.target.id==='rvPwd'&&ev.key==='Enter'){ev.preventDefault();rvDecide('pwd');return}
 if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('div[role=button][data-a]')){ev.preventDefault();ev.target.click();return}
 const tag=(ev.target.tagName||'');if(tag==='INPUT'&&ev.target.type!=='checkbox')return;
 const B=S.batch;
 if(S.view==='batch'&&B&&B.phase==='review'&&!$('#layer .modal')){
  const k=ev.key.toLowerCase();const mod=ev.metaKey||ev.ctrlKey;
  if(mod&&k==='z'){ev.preventDefault();rvUndo();return}
  if(mod)return;
  if(k==='j'||ev.key==='ArrowDown'){ev.preventDefault();rvStep(1)}
  else if(k==='k'||ev.key==='ArrowUp'){ev.preventDefault();rvStep(-1)}
  else if(['1','2','a','b'].includes(k)){const it=rvCur();if(it){const a=B.groups[it.gi].acts['1a'.includes(k)?0:1];if(a)rvDecide(a.k)}}
  else if(k==='e'){S.docMode=(S.docMode||'orig')==='orig'?'fx':'orig';render()}
  else if(k==='c'){S.docMode=(S.docMode||'orig')==='cmp'?'orig':'cmp';render()}
  return;
 }
 const s=S.single;
 if(S.view==='single'&&s&&s.phase==='review'){
  const k=ev.key.toLowerCase();const mod=ev.metaKey||ev.ctrlKey;
  if(mod&&k==='z'){ev.preventDefault();doUndo();return}
  if(mod&&ev.key==='Enter'){ev.preventDefault();if(s.from!=='batch')exportSingle();return}
  if(mod)return;
  if(k==='j'||ev.key==='ArrowDown'){ev.preventDefault();stepHit(1)}
  else if(k==='k'||ev.key==='ArrowUp'){ev.preventDefault();stepHit(-1)}
  else if(k==='x'&&s.focus>=0){setHit(s.hits[s.focus].state==='keep'?'redact':'keep')}
  else if(k==='e'){closePop();setMode(s.mode==='orig'?'fx':'orig')}
  else if(k==='c'){closePop();setMode(s.mode==='cmp'?'orig':'cmp')}
 }
});

const SCENES=[
 ['h','入口'],['首页','home'],['首页 · 首次使用','fresh'],
 ['h','模型准备'],['下载中','model-download'],['下载已暂停','model-paused'],['断网 / 下载中断','model-offline'],['空间不足','model-disk'],['校验失败','model-integrity'],['加载与试运行','model-loading'],['启动失败','model-load'],['已选文件 · 等待模型','model-wait'],['批量 · 模型未就绪','model-batch'],['插件 · 模型待下载','model-plugins'],

function scene(k){
 closeModal();closePop();clearInterval(bT);clearInterval(procT);resetModels();S.behind=null;S.navStack=[];S.history=S.history.filter(h=>!h.park&&!h.saved);
 if(['s1','s2','s3','s4','s5'].includes(k)){newSingle(k==='s5'?'劳动合同.docx':'劳动合同.pdf',1887436,k==='s1'?{}:{phase:'review',mode:k==='s4'?'cmp':'orig'});if(k==='s3'){S.single.hits[13].state='keep';exportSingle()}return}
 if(k.startsWith('b')){S.batch=null;newBatch(demoNames(214),{title:'客户材料 · 10 月'});if(k==='b1')return;if(k==='b6'){S.batch.mode='auto';startBatch();for(let i=0;i<1500&&S.batch.phase!=='result';i++)tick();render();return}startBatch();
  if(k==='b5'){for(let i=0;i<60;i++)tick();enterReview(null);return}
  if(k==='b2'){for(let i=0;i<34;i++)tick();patchBatch(true);return}
  for(let r=0;r<3;r++){for(let i=0;i<120;i++)tick();S.batch.groups.forEach(g=>{if(gMembers(g).length)resolve(g.id,g.acts[0].k)})}for(let i=0;i<60;i++)tick();
  const t=$('#layer .toast');if(t)t.remove();
  if(k==='b4')S.batch.phase='manifest';render();return}
 if(k.startsWith('model-')){
  S.history=[];S.single=null;S.batch=null;S.homePreset='通用办公脱敏';S.view='home';const key=k.slice(6);resetModels('missing');
  if(key==='plugins'){S.view='plugins';render();return}
  if(key==='batch'){newBatch(demoNames(12),{title:'待处理材料'});return}
  if(key==='download'){modelById('astr').progress=35;modelDownload();return}
  if(key==='paused'){modelById('astr').status='paused';modelById('astr').progress=45}
  if(['offline','disk','integrity','load'].includes(key)){modelById('astr').status='error';modelById('astr').error=key;modelById('astr').progress=key==='offline'?45:key==='disk'?20:100}
  if(key==='loading'){modelPrepare();return}
  if(key==='wait'){takeFiles([{name:'劳动合同.pdf',size:1887436}]);return}
  render();return;
 }
 if(k==='fresh'){S.homePreset='通用办公脱敏';resetModels('missing');S.history=[];S.single=null;S.batch=null;S.view='home';render();return}
 if(k==='close'){A.closeWin();return}
 S.view=k;render();
}
