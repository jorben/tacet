version: '3'

vars:
  APP_NAME: "tacet"
  BIN_DIR: "bin"
  # The desktop entry lives outside the module root; build, bindings and .syso tasks use these
  MAIN_DIR: "cmd/tacet-desktop"
  MAIN_PKG: "./cmd/tacet-desktop"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS. First release targets
  # are macOS arm64 and Windows x64 (architecture section 10).
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml

tasks:
  build:
    summary: Compiles the desktop executable into bin/ (use package to create a macOS .app or Windows installer)
    cmds:
      - task: "{{.GOOS}}:build"

  build:cli:
    summary: Builds the CLI into bin/cli (a separate directory, so it never clashes with the desktop binary)
    cmds:
      - go build -o "{{.BIN_DIR}}/cli/tacet{{exeExt}}" ./cmd/tacet

  package:
    summary: Builds and packages the desktop application (macOS .app or Windows installer)
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the desktop application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the desktop application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  install:msix:tools:
    summary: Installs tools required for Windows MSIX packaging
    cmds:
      - task: windows:install:msix:tools

  bindings:
    summary: Generates the TypeScript bindings for the desktop services
    cmds:
      - task: common:generate:bindings

  ensure:dist:
    summary: Creates a placeholder frontend/dist so Go packages compile without a frontend build
    internal: true
    status:
      - test -f frontend/dist/index.html
    cmds:
      - mkdir -p frontend/dist
      - echo '<!doctype html><title>Tacet</title>' > frontend/dist/index.html

  python:sync:
    summary: Installs the Python SDK and built-in plugins into python/.venv, which the cross-language Go tests start
    internal: true
    dir: python
    cmds:
      - uv sync --locked --all-packages

  test:
    summary: Runs the Go tests, including the module dependency rules (internal/archtest); a missing python/.venv fails them
    deps: [ensure:dist, python:sync]
    vars:
      RACE: '{{.RACE | default ""}}'
    env:
      TACET_REQUIRE_PLUGINS: '1'
    cmds:
      - go test {{.RACE}} -count=1 -timeout 30m ./...

  test:race:
    summary: Runs the Go tests under the race detector, as CI does on macOS
    cmds:
      - task: test
        vars:
          RACE: -race

  test:frontend:
    summary: Runs the frontend unit tests (vitest)
    cmds:
      - task: common:frontend:run
        vars:
          SCRIPT: test

  fmt:check:
    summary: Fails when a Go file is not gofmt'd
    cmds:
      - |
        bad=$(gofmt -l $(git ls-files '*.go'))
        if [ -n "$bad" ]; then echo "not gofmt'd:"; echo "$bad"; exit 1; fi

  lint:
    summary: Runs gofmt, go vet and the frontend type check
    deps: [ensure:dist]
    cmds:
      - task: fmt:check
      - go vet ./...
      - task: common:frontend:run
        vars:
          SCRIPT: typecheck

  test:python:
    summary: Runs the Python SDK and built-in plugin tests
    dir: python
    cmds:
      - uv run --locked --all-packages python -m unittest discover -s tests

  check:backend-trace:
    summary: Verifies every backend design identifier has a current module and acceptance mapping
    cmds:
      - python3 tools/backend_trace.py --check

  check:
    summary: Runs every check that CI runs (the Go suite under -race on macOS, as CI does)
    cmds:
      - task: check:backend-trace
      - task: lint
      - task: test:frontend
      - task: test
        vars:
          RACE: '{{if eq OS "darwin"}}-race{{end}}'
      - task: test:python
