version = 1
revision = 2
requires-python = ">=3.12"

[manifest]
members = [
    "tacet-detect-astrlink",
    "tacet-format-csv",
    "tacet-format-docx",
    "tacet-format-json",
    "tacet-format-pdf",
    "tacet-format-text",
    "tacet-format-xlsx",
    "tacet-plugin-sdk",
]

[[package]]
name = "tacet-detect-astrlink"
version = "0.1.0"
source = { editable = "plugins/detect-astrlink" }
dependencies = [
    { name = "tacet-plugin-sdk" },
]

[package.metadata]
requires-dist = [{ name = "tacet-plugin-sdk", editable = "sdk" }]

