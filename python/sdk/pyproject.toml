[project]
name = "tacet-plugin-sdk"
version = "0.1.0"
description = "Python SDK for Tacet plugins: protocol framing, lifecycle and resource access"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["cryptography>=46,<48", "jsonschema>=4.26,<5", "lxml>=6.0,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"../../protocol/schema/v1" = "tacet_plugin_sdk/schemas/v1"
