[project]
name = "tacet-format-docx"
version = "0.1.0"
description = "Built-in Tacet plugin. DOCX: full part inventory, cross-run write-back and image handling (architecture 4.5)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "tacet-plugin-sdk",
    "lxml>=6.0,<7",
    "msoffcrypto-tool>=5.4,<6",
]

[tool.uv.sources]
tacet-plugin-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
