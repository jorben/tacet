[project]
name = "tacet-detect-privacy-filter"
version = "0.1.0"
description = "Built-in Tacet plugin. OpenAI Privacy Filter adapter: tokenisation, windows, BIOES Viterbi decoding and label mapping (architecture 8.2)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["tacet-plugin-sdk", "onnxruntime>=1.24,<2", "tokenizers>=0.22,<1", "numpy>=2,<3"]

[tool.uv.sources]
tacet-plugin-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
