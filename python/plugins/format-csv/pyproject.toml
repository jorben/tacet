[project]
name = "tacet-format-csv"
version = "0.1.0"
description = "Built-in Tacet plugin. CSV: streaming read and write with formula-injection guarding"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["tacet-plugin-sdk"]

[tool.uv.sources]
tacet-plugin-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
