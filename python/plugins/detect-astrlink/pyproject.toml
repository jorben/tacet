[project]
name = "tacet-detect-astrlink"
version = "0.1.0"
description = "Built-in Tacet plugin. AstrLink Guard model adapter: tokenisation, windows, decoding and label mapping (architecture 8.2)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["tacet-plugin-sdk", "onnxruntime>=1.24,<2; sys_platform != 'win32'", "onnxruntime-directml>=1.24,<2; sys_platform == 'win32'", "tokenizers>=0.22,<1", "numpy>=2,<3"]

[tool.uv.sources]
tacet-plugin-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
