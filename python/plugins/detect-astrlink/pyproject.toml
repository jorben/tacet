[project]
name = "tacet-detect-astrlink"
version = "0.1.0"
description = "Built-in Tacet plugin. AstrLink Guard model adapter: tokenisation, windows, decoding and label mapping (architecture 8.2)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["tacet-plugin-sdk"]

[tool.uv.sources]
tacet-plugin-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
